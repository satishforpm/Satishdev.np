
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Satish Dev NP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101827, #173b68);
      color: #fff;
    }

    .contact-card {
      width: 100%;
      max-width: 480px;
      padding: 28px;
      background: #fff;
      color: #172033;
      border-radius: 20px;
      box-shadow: 0 15px 45px #0004;
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
    }

    .intro {
      text-align: center;
      color: #657084;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: 600;
    }

    input, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd3df;
      border-radius: 9px;
      font: inherit;
      background: #f9fafc;
      color: #172033;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    input:focus, textarea:focus {
      outline: 2px solid #3b82f6;
      border-color: #3b82f6;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #1769e0;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #form-status {
      text-align: center;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .back-link {
      display: block;
      margin-top: 18px;
      text-align: center;
      color: #1769e0;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="contact-card">
    <h1>Contact Us</h1>
    <p class="intro">
      Have a question or need a website?
      Send us a message.
    </p>

    <form id="contact-form">
      <label for="name">Your Name</label>
      <input
        id="name"
        type="text"
        name="name"
        autocomplete="name"
        maxlength="100"
        required
      >

      <label for="email">Your Email</label>
      <input
        id="email"
        type="email"
        name="email"
        autocomplete="email"
        maxlength="254"
        required
      >

      <label for="message">Your Message</label>
      <textarea
        id="message"
        name="message"
        maxlength="4000"
        required
      ></textarea>

      <button id="send-btn" type="submit">
        Send Message
      </button>

      <p id="form-status" role="status" aria-live="polite"></p>
    </form>

    <a class="back-link" href="index.html">
      ← Back to Home
    </a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@5/dist/email.min.js"></script>

  <script>
    emailjs.init({
      publicKey: "8rMVW77krz2lrfJ9_"
    });

    const form = document.getElementById("contact-form");
    const button = document.getElementById("send-btn");
    const status = document.getElementById("form-status");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (button.disabled) return;

      button.disabled = true;
      status.textContent = "Sending your message...";

      try {
        await emailjs.sendForm(
          "service_c2bhwhh",
          ":template_8vir4nc",
          form
        );

        status.textContent =
          "Message sent successfully! Thank you.";
        form.reset();
      } catch (error) {
        console.error("EmailJS error:", error);
        status.textContent =
          "Message could not be sent. Please try again.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
